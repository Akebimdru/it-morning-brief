name: Daily brief

on:
  schedule:
    - cron: "0 22 * * *"   # 매일 07:00 KST (= 22:00 UTC)
  workflow_dispatch:        # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --quiet anthropic
      - name: Fetch news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # 없으면 무료 번역으로 대체
        run: python fetch_news.py
      - name: Commit
        run: |
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add index.html archive
          git diff --cached --quiet || git commit -m "brief $(TZ=Asia/Seoul date +%F)"
          git push
